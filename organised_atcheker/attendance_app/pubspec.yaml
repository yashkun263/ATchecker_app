name: attendance_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  my_go_wrapper:
    path: ../my_go_wrapper
    
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  dio: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
